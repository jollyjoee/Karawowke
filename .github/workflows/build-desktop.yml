name: Build Desktop App (Linux AppImage + Windows EXE)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ktv/desktop fetch-binaries
      - run: pnpm --filter @ktv/desktop dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: karawowke-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ktv/desktop fetch-binaries
      - run: pnpm --filter @ktv/desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: karawowke-windows
          path: apps/desktop/release/*.exe
